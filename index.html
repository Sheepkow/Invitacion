<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Boda</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #f8ede3, #e9d5c3);
    font-family: Georgia, serif;
    overflow: hidden;
  }

  /* ===== SOBRE ===== */
  .sobre-contenedor {
    cursor: pointer; text-align: center;
    transition: opacity .8s ease, transform .8s ease;
  }
  .sobre-contenedor.oculto { opacity: 0; transform: scale(.8); pointer-events: none; }
  .sobre {
    position: relative; width: 300px; height: 200px;
    background: #d9b99b; border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    animation: latido 1.8s ease-in-out infinite;
  }
  .sobre::before, .sobre::after {
    content: ""; position: absolute; bottom: 0;
    width: 0; height: 0; border-style: solid;
  }
  .sobre::before { left: 0; border-width: 100px 0 100px 150px; border-color: transparent transparent transparent #c9a583; }
  .sobre::after  { right: 0; border-width: 100px 150px 100px 0; border-color: transparent #c9a583 transparent transparent; }
  .solapa {
    position: absolute; top: 0; left: 0; width: 0; height: 0;
    border-style: solid; border-width: 110px 150px 0 150px;
    border-color: #b98f6c transparent transparent transparent;
    transform-origin: top; transition: transform .8s ease; z-index: 3;
  }
  .sello {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: #8b2e3c; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; z-index: 4; box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }
  .sobre-contenedor.abriendo .solapa { transform: rotateX(180deg); }
  .indicacion { margin-top: 24px; color: #6b4f3a; font-style: italic; letter-spacing: 1px; }
  @keyframes latido { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  /* ===== INVITACIÓN ===== */
  .invitacion {
    position: absolute; width: min(94vw, 480px);
    max-height: 96vh; overflow-y: auto;
    background: #fffaf4; border: 2px solid #d9b99b; border-radius: 12px;
    padding: 18px; text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,.3);
    opacity: 0; transform: translateY(60px) scale(.9);
    pointer-events: none;
    transition: opacity 1s ease, transform 1s ease;
  }
  .invitacion.visible { opacity: 1; transform: none; pointer-events: auto; }
  .invitacion img.foto {
    width: 100%; height: auto;
    border-radius: 8px; margin-bottom: 18px;
  }
  .invitacion p { color: #4a3a2e; margin: 8px 0; line-height: 1.5; }

  /* ===== CUENTA REGRESIVA ===== */
  .cuenta { display: flex; justify-content: center; gap: 10px; margin: 6px 0; }
  .cuenta div {
    background: #8b2e3c; color: #fff; border-radius: 8px;
    padding: 10px 6px; min-width: 62px;
  }
  .cuenta span { display: block; font-size: 1.5rem; font-weight: bold; }
  .cuenta small { font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; }

  /* ===== UBICACIONES ===== */
  .lugar { margin-top: 22px; padding-top: 16px; border-top: 1px solid #e3cdb6; }
  .lugar h2 { font-size: 1.15rem; color: #8b2e3c; }
  .lugar .hora { font-size: .95rem; color: #6b4f3a; margin-bottom: 8px; }
  .mapa { width: 100%; height: 220px; border: 0; border-radius: 8px; margin-top: 6px; }

  /* ===== BOTONES ===== */
  .boton {
    display: inline-block; margin-top: 12px; padding: 12px 22px;
    border-radius: 30px; text-decoration: none; color: #fff;
    font-family: inherit; font-size: 1rem; transition: transform .2s ease;
  }
  .boton:hover { transform: scale(1.05); }
  .whatsapp { background: #25d366; }
  .ruta { background: #8b2e3c; font-size: .9rem; padding: 9px 18px; }

  .btn-musica {
    position: fixed; top: 14px; right: 14px;
    background: #8b2e3c; color: #fff; border: none;
    width: 44px; height: 44px; border-radius: 50%;
    font-size: 18px; cursor: pointer; display: none; z-index: 10;
  }
</style>
</head>
<body>

  <!-- Sobre -->
  <div class="sobre-contenedor" id="sobre">
    <div class="sobre">
      <div class="solapa"></div>
      <div class="sello">♥</div>
    </div>
    <p class="indicacion">Toca para abrir tu invitación</p>
  </div>

  <!-- Invitación -->
  <div class="invitacion" id="invitacion">
    <img class="foto" src="foto.jpg" alt="Invitación de boda de Citlali y Carlos">

    <!-- Cuenta regresiva -->
    <div class="cuenta" id="cuenta">
      <div><span id="dias">0</span><small>Días</small></div>
      <div><span id="horas">0</span><small>Horas</small></div>
      <div><span id="min">0</span><small>Min</small></div>
      <div><span id="seg">0</span><small>Seg</small></div>
    </div>
    <p id="mensajeCuenta" style="font-style:italic;"></p>

    <!-- UBICACIÓN 1: CEREMONIA -->
    <div class="lugar">
      <h2>⛪ Ceremonia religiosa</h2>
      <p class="hora">Templo de San Francisco · 1:00 P. M.</p>
      <iframe class="mapa" loading="lazy"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3762.7877493477004!2d-102.06380899999999!3d19.421574600000003!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x842de26837f0094d%3A0xf3be0307fa9b3472!2sParroquia%20de%20San%20Francisco!5e0!3m2!1ses-419!2smx!4v1793852110044!5m2!1ses-419!2smx"
        allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <a class="boton ruta" target="_blank"
         href="https://maps.app.goo.gl/BXQXivQn7kossJor6">📍 Cómo llegar a la ceremonia</a>
    </div>

    <!-- UBICACIÓN 2: RECEPCIÓN -->
    <div class="lugar">
      <h2>🎉 Recepción</h2>
      <p class="hora">Salón Finca Don Ismael · 2:00 P. M.</p>
      <iframe class="mapa" loading="lazy"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3763.189632158841!2d-102.07172452478623!3d19.40421088186901!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x842de27fb2819641%3A0x8914d871a6d123be!2sSalon%20de%20Eventos%20Finca%20Don%20Ismael!5e0!3m2!1ses-419!2smx!4v1793851003482!5m2!1ses-419!2smx"
        allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
      <a class="boton ruta" target="_blank"
         href="https://maps.app.goo.gl/EHM5FJ3iWX1JNQBc9">📍 Cómo llegar a la recepción</a>
    </div>

    <!-- Confirmar por WhatsApp -->
    <div class="lugar">
      <p>¿Nos acompañarás? Confirma tu asistencia:</p>
      <a class="boton whatsapp" id="btnWhats" target="_blank" href="#">💬 Confirmar por WhatsApp</a>
    </div>
  </div>

  <button class="btn-musica" id="btnMusica" title="Música">🔊</button>

  <audio id="audio" src="musica.mp3" loop preload="auto"></audio>

<script>
  /* ====== CONFIGURA AQUÍ ====== */
  const FECHA_BODA = new Date('2027-01-02T13:00:00'); // año-mes-díaThora:min:seg
  const WHATSAPP   = '5214251263004';                 // código de país + número, sin + ni espacios
  const MENSAJE    = 'Hola, confirmo mi asistencia a la boda. Mi nombre es: ';
  /* ============================ */

  const sobre = document.getElementById('sobre');
  const invitacion = document.getElementById('invitacion');
  const audio = document.getElementById('audio');
  const btn = document.getElementById('btnMusica');

  sobre.addEventListener('click', () => {
    sobre.classList.add('abriendo');
    audio.volume = 0.6;
    audio.play().catch(() => {});
    setTimeout(() => sobre.classList.add('oculto'), 900);
    setTimeout(() => {
      invitacion.classList.add('visible');
      btn.style.display = 'block';
    }, 1200);
  });

  btn.addEventListener('click', () => {
    if (audio.paused) { audio.play(); btn.textContent = '🔊'; }
    else { audio.pause(); btn.textContent = '🔇'; }
  });

  function actualizarCuenta() {
    const resta = FECHA_BODA - new Date();
    if (resta <= 0) {
      document.getElementById('cuenta').style.display = 'none';
      document.getElementById('mensajeCuenta').textContent = '¡Hoy es el gran día! 💍';
      return;
    }
    document.getElementById('dias').textContent  = Math.floor(resta / 86400000);
    document.getElementById('horas').textContent = Math.floor(resta / 3600000) % 24;
    document.getElementById('min').textContent   = Math.floor(resta / 60000) % 60;
    document.getElementById('seg').textContent   = Math.floor(resta / 1000) % 60;
  }
  actualizarCuenta();
  setInterval(actualizarCuenta, 1000);

  document.getElementById('btnWhats').href =
    `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(MENSAJE)}`;
</script>
</body>
</html>
